[settings]
quiet = true

[tasks.api]
description = "Run the API CLI"
dir = "./api"
run = "node --import=tsx ./main.ts"

[tasks.check]
description = "Run all code checks"
depends = ["check:biome", "tsc api", "tsc app"]

[tasks."check:biome"]
hide = true
run = "bun biome check --diagnostic-level=warn --write --unsafe ."

[tasks.tsc]
description = "Run type checks"
usage = 'arg "<pkg>"'
run = '''
cd "./${usage_pkg?}"
bun tsgo
'''

[tasks.dev]
description = "Start API and app in watch mode"
depends = ["dev:node api", "dev:vite app"]

[tasks."dev:node"]
hide = true
usage = 'arg "<svc>"'
run = '''
cd "./${usage_svc?}"
node --import=tsx --watch-kill-signal=SIGKILL --watch-path=./{commands,databases,lib,primitives,routes,services,trpc} --watch-preserve-output ./main.ts start
'''

[tasks."dev:vite"]
hide = true
usage = 'arg "<pkg>"'
run = '''
cd "./${usage_pkg?}"
bun vite
'''

[tasks.test]
description = "Run tests"
run = "bun vitest run"

[tasks.clean]
description = "Clean the project"
run = "rm -rf node_modules app/node_modules **/*.log"

[tasks.down]
description = "Stop all services"
run = "docker compose down --remove-orphans --timeout 0"

[tasks.up]
description = "Start services and setup database"
run = ["docker compose up -d --wait", "mise api db:migrate", "mise api db:seed"]

[tasks.reset]
description = "Reset development environment"
run = ["mise down", "mise run up"]

[tasks.setup]
description = "Setup the project"
run = ["bun i --frozen-lockfile"]

[tasks.studio]
description = "Open Drizzle Studio"
run = ["bun drizzle-kit studio --port 4444"]

[tasks.ui]
description = "Run the shadcn/ui CLI, e.g. `mise ui add button` (or `mise ui add` for the interactive picker)"
run = "bunx shadcn@latest"

[tools]
bun = "1.3.12"
node = "24.11.1"
